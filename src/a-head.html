<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摄像机试验台</title>
<meta name="description" content="光具座上的一台可拆开的相机：拨镜头上的对焦环、变焦环、光圈环，转机顶的快门、ISO、白平衡转盘，或者控制台上的旋钮，看焦平面、景深、曝光、运动模糊、噪点和色偏怎样变化。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700;900&family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0f1a;--ink:#eef2fa;--soft:#cfd6e6;--mute:#9ea8c2;--dim:#8a94b0;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.16);
  --cyan:#7fe3ff;--amber:#ffb454;--green:#3ddc84;--red:#ff6b5e;
  --glass:linear-gradient(150deg,rgba(20,26,42,.92),rgba(13,18,32,.9));
  --sans:"Outfit","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  font-family:var(--sans);color:var(--ink);background:var(--bg);
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.cy{color:var(--cyan)!important}.am{color:var(--amber)!important}.rd{color:var(--red)!important}.gr{color:var(--green)!important}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;isolation:isolate;background:var(--bg)}
#world{position:absolute;inset:0;z-index:0}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#gl.grabbing{cursor:grabbing}
#gl.turn{cursor:grab}
#gl.pointer{cursor:pointer}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(7,10,19,.55),transparent 28%),radial-gradient(ellipse at 55% 50%,transparent 58%,rgba(4,6,12,.6) 100%)}
#labels{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.lbl,.tag{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:999px;
  background:rgba(10,14,24,.8);border:1px solid var(--line);font-size:11px;font-weight:600;color:#e6ecf7;white-space:nowrap;
  opacity:0;transition:opacity .3s;will-change:transform}
.lbl.on,.tag.on{opacity:1}
.lbl::before,.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.lbl em,.tag em{font:500 9.5px/1 var(--mono);font-style:normal;color:var(--mute)}
.lbl.warm::before,.tag.soft::before{background:var(--amber);box-shadow:0 0 6px var(--amber)}
#loading{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:var(--bg);color:var(--mute);font-size:14px;letter-spacing:.08em;transition:opacity .6s}
#loading.gone{opacity:0;pointer-events:none}
#loading.err{color:#ffb4a8;padding:24px;text-align:center;line-height:1.7}

/* --- top bar ------------------------------------------------------------------------ */
.top{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:14px;padding:12px 18px 0 22px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;text-shadow:0 2px 18px rgba(0,0,0,.65)}
.brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.08em;white-space:nowrap}
.brand h1 b{color:var(--cyan);font-weight:900}
.brand .en{font:500 10px/1 var(--mono);letter-spacing:.2em;color:var(--dim);white-space:nowrap}
.bar{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mini{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--dim);margin-right:-2px}
.seg{display:flex;gap:2px;padding:3px;border-radius:11px;background:rgba(10,14,24,.72);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button{padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:500;color:#cfd6e6;white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{background:rgba(255,255,255,.08)}
.seg button[aria-pressed="true"]{background:#eef2fa;color:#0b0f1a;font-weight:700}
.pill{height:34px;padding:0 13px;border-radius:10px;background:rgba(10,14,24,.72);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill:hover{background:rgba(30,38,58,.85)}
.pill[aria-expanded="true"]{background:#eef2fa;color:#0b0f1a}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(10,14,24,.72);border:1px solid var(--line);color:#dfe5ee;font-weight:800;font-size:15px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ib:hover{background:rgba(30,38,58,.85)}
.ib[aria-pressed="true"]{background:#eef2fa;color:#0b0f1a}
.ib svg{width:17px;height:17px}

/* --- left column: cards over the world ------------------------------------------------ */
.side{position:absolute;left:22px;top:62px;bottom:16px;width:312px;z-index:4;pointer-events:none;display:flex;flex-direction:column;gap:9px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.side>*{pointer-events:auto;flex:none}
.card{border:1px solid var(--line);border-radius:14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 50px -24px rgba(0,0,0,.75)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{padding:8px 10px 7px;border-radius:11px;background:rgba(13,18,32,.8);border:1px solid var(--line);min-width:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stat i{display:block;font-size:10.5px;font-style:normal;font-weight:600;letter-spacing:.14em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;margin-top:5px;font:500 15px/1.1 var(--mono);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stat small{display:block;margin-top:3px;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.hot b{color:var(--cyan)}
.stat.warn b{color:var(--amber)}.stat.bad b{color:var(--red)}.stat.good b{color:var(--cyan)}
.subline{margin:-2px 2px 0;font:400 11px/1 var(--mono);color:var(--dim);letter-spacing:.02em}
.explain{margin:0;padding:12px 14px;font-size:13px;line-height:1.75;color:var(--soft);text-wrap:pretty}
.explain b{color:#fff;font-weight:700}
.drawers{display:flex;gap:6px}
.dbtn{flex:1;height:32px;border-radius:10px;background:rgba(10,14,24,.72);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:#dfe5ee;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dbtn:hover{background:rgba(30,38,58,.85)}
.dbtn[aria-pressed="true"]{background:rgba(127,227,255,.16);border-color:rgba(127,227,255,.45);color:#fff}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 13px 0}
.card-h h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.22em;color:#c9d1e3}
.card-h em{font:400 11px/1.3 var(--mono);font-style:normal;color:var(--dim);text-align:right}
.drawer .stats{padding:4px 10px 11px}
#dofScale{display:block;width:calc(100% - 16px);height:auto;margin:8px 8px 0}
#dofScale text{font:500 9px var(--mono);fill:var(--dim)}
#dofScale .sub text{fill:#dfe5ee;font-size:9px}
.kv{display:flex;flex-wrap:wrap;gap:4px 12px;padding:4px 13px 9px;font:400 11.5px/1.4 var(--mono);color:var(--soft)}
.kv span{white-space:nowrap}
.kv i{font-style:normal;color:var(--dim);font-family:var(--sans);font-size:11px;margin-right:4px}
.evline{padding:0 13px 2px;font:400 11px/1.4 var(--mono);color:var(--dim)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 10px 0}
.tabs button{padding:5px 9px;border-radius:8px;font-size:12px;font-weight:600;color:var(--mute);background:rgba(255,255,255,.04)}
.tabs button[aria-selected="true"]{background:rgba(127,227,255,.14);color:var(--cyan)}
.fbody{padding:8px 14px 13px;font-size:12.5px;line-height:1.7;color:var(--soft)}
.fbody p{margin:6px 0}
.fbody .eq{margin:8px 0;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.05);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.fbody .eq .katex{font-size:.94em}
.fbody .eq .katex-display{margin:0}
.fbody .eq.live{border-color:rgba(127,227,255,.22)}
.fbody b{color:#fff}
.katex{color:#eef2fa}
.fallback{font:400 12px/1.6 var(--mono);white-space:pre-wrap;color:#dfe5ee}
.exp{padding:12px 14px 13px;border-color:rgba(127,227,255,.35);background:linear-gradient(160deg,rgba(18,40,54,.95),rgba(14,19,33,.95))}
.exp h3{margin:0;font-size:13.5px;font-weight:800;color:var(--cyan);display:flex;gap:8px;align-items:center}
.exp h3 button{margin-left:auto;color:var(--mute);font-size:17px;line-height:1}
.exp p{margin:6px 0 0;font-size:12.5px;line-height:1.65;color:var(--soft)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exp .row{margin-top:9px}
.p-btn{padding:4px 9px;border-radius:7px;font-size:11.5px;font-weight:600;color:#dfe5ee;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);white-space:nowrap}
.p-btn:hover{background:rgba(255,255,255,.13)}
.p-btn[aria-pressed="true"]{background:rgba(127,227,255,.2);border-color:rgba(127,227,255,.5);color:#fff}
.p-hint{font-size:10.5px;color:var(--dim);letter-spacing:.04em}

/* --- film roll (module "shoot") ------------------------------------------------------- */
.rollcard{position:absolute;right:18px;bottom:16px;z-index:4;width:282px;padding:10px 10px 11px}
.rollcard h2{margin:0 2px 8px;font-size:12px;font-weight:700;letter-spacing:.22em;color:#c9d1e3;display:flex;justify-content:space-between;align-items:baseline}
.rollcard h2 em{font:400 10.5px var(--sans);font-style:normal;color:var(--dim);letter-spacing:.04em}
.roll{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.roll:empty::before{content:"按机顶或控制台上的红色快门钮拍照，照片会带着参数出现在这里。";grid-column:1/-1;font-size:11.5px;color:var(--dim);line-height:1.5}
.shot{position:relative;padding:0;border-radius:6px;overflow:hidden;border:1px solid var(--line2);aspect-ratio:3/2;background:#000}
.shot canvas{display:block;width:100%;height:100%}
.shot span{position:absolute;left:0;right:0;bottom:0;padding:2px 4px;font:500 8.5px/1.3 var(--mono);color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;padding:7px 14px;border-radius:999px;background:rgba(10,14,24,.66);border:1px solid var(--line);
  font-size:12px;color:#cfd6e6;letter-spacing:.03em;transition:opacity .8s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hint b{color:var(--cyan);font-weight:600}
.hint.gone{opacity:0}

/* --- hover bubble for controls ------------------------------------------------------- */
.tip{position:fixed;left:0;top:0;z-index:30;display:flex;flex-direction:column;gap:2px;padding:7px 11px 8px;border-radius:10px;background:rgba(10,14,24,.9);border:1px solid rgba(127,227,255,.35);
  box-shadow:0 10px 30px -10px rgba(0,0,0,.8);pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap}
.tip.on{opacity:1}
.tip b{font-size:12px;font-weight:700;letter-spacing:.08em;color:#c9d1e3}
.tip span{font:500 17px/1.15 var(--mono);color:#fff;font-variant-numeric:tabular-nums}
.tip i{font-size:11px;font-style:normal}
.tip em{font-size:10.5px;font-style:normal;color:var(--dim)}

/* --- menus ------------------------------------------------------------------------------ */
.menu{position:absolute;z-index:22;top:54px;right:18px;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 70px);overflow:auto;padding:8px}
.menu button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
.menu button:hover,.menu button:focus-visible{background:rgba(255,255,255,.06)}
.menu b{display:block;font-size:13.5px;font-weight:700;color:#fff}
.menu small{display:block;margin-top:3px;font-size:12px;line-height:1.5;color:var(--mute)}
.menu .chk{flex:none;width:18px;height:18px;margin-top:1px;border-radius:5px;border:1.5px solid var(--line2);background:rgba(255,255,255,.04)}
.menu [aria-checked="true"] .chk{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 3px #0e1322}
.menu-note{margin:6px 12px 6px;font-size:11.5px;line-height:1.6;color:var(--dim)}

/* --- the big viewer ------------------------------------------------------------------- */
.big{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:64px 22px 22px}
.bigslot{position:relative;width:min(100%,calc((100vh - 96px) * 1.5));aspect-ratio:3/2;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.16),0 30px 80px -30px rgba(0,0,0,.9);overflow:hidden;cursor:crosshair}
#app.big-on .side,#app.big-on #labels,#app.big-on .hint,#app.big-on .vignette,#app.big-on .rollcard{visibility:hidden}
.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.grid path{stroke:rgba(255,255,255,.28);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.slot-bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;background:linear-gradient(180deg,rgba(6,9,16,.72),rgba(6,9,16,0));pointer-events:none}
.slot-bar>*{pointer-events:auto}
.slot-title{font-size:11.5px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.86);text-shadow:0 1px 6px rgba(0,0,0,.7);white-space:nowrap;pointer-events:none!important}
.tools{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.tools button{padding:4px 8px;border-radius:7px;font-size:11.5px;font-weight:600;color:#dfe5ee;background:rgba(10,14,24,.62);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tools button:hover{background:rgba(30,38,58,.8)}
.tools button[aria-pressed="true"]{background:rgba(127,227,255,.2);border-color:rgba(127,227,255,.45);color:#fff}
.lcd{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:7px 12px;
  background:linear-gradient(0deg,rgba(4,6,11,.8),rgba(4,6,11,0));font:500 13px/1 var(--mono);color:#fff;white-space:nowrap;pointer-events:none;text-shadow:0 1px 4px #000}
.lcd .md{padding:2px 6px;border-radius:4px;background:#eef2fa;color:#0b0f1a;font-weight:600}
.lcd .auto{color:var(--amber)}
.lcd .blink{animation:blink 1s steps(2,start) infinite;color:var(--red)}
@keyframes blink{to{visibility:hidden}}
.lcd .scale{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:10px}
.lcd .scale i{display:inline-block;width:3px;height:9px;background:rgba(255,255,255,.35);font-style:normal}
.lcd .scale i.z{height:13px;background:#fff}
.lcd .scale i.on{background:var(--amber)}
.histo{visibility:hidden;position:absolute;right:10px;top:42px;width:min(170px,26%);aspect-ratio:340/156;height:auto;border-radius:6px;background:rgba(6,9,16,.55);border:1px solid rgba(255,255,255,.12);pointer-events:none;backdrop-filter:blur(3px)}
.histo.ready{visibility:visible}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.focus-ping{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border:2px solid var(--cyan);border-radius:6px;pointer-events:none;animation:ping .8s ease-out forwards}
@keyframes ping{0%{transform:scale(1.6);opacity:0}25%{transform:scale(1);opacity:1}100%{opacity:0}}

/* --- dialogs and toasts --------------------------------------------------------------------------- */
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:24px 16px;background:rgba(5,8,15,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{position:relative;width:min(760px,100%);max-height:min(88vh,900px);overflow:auto;padding:26px 30px 22px;overscroll-behavior:contain;user-select:text;-webkit-user-select:text}
.sheet h2{margin:0 40px 6px 0;font-size:22px;font-weight:900;letter-spacing:.04em}
.sheet .lead{margin:0 0 6px;color:var(--mute);font-size:13px;line-height:1.7}
.sheet h3{margin:22px 0 6px;font-size:14px;font-weight:800;color:#fff;display:flex;align-items:baseline;gap:8px}
.sheet h3 small{font:500 11px var(--mono);color:var(--dim)}
.sheet p,.sheet li{font-size:13.5px;line-height:1.8;color:#cdd4e4}
.sheet p{margin:4px 0}
.sheet ul{margin:4px 0;padding-left:1.3em}
.sheet b{color:#fff}
.sheet .eq{margin:8px 0;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06);overflow-x:auto}
.sheet table{border-collapse:collapse;font-size:12.5px;margin:6px 0}
.sheet td,.sheet th{padding:4px 10px;border-bottom:1px solid var(--line);text-align:left;color:#cdd4e4;font-weight:500}
.sheet th{color:var(--dim);font-weight:600}
.sheet .foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.sheet .pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-size:12px}
.sheet .pipe span{padding:5px 9px;border-radius:8px;background:rgba(127,227,255,.1);border:1px solid rgba(127,227,255,.25);color:#e6f7ff}
.sheet .pipe i{color:var(--dim);font-style:normal}
.sheet a{color:var(--cyan)}
kbd{display:inline-block;min-width:1.7em;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-bottom-width:2px;font:500 11px/1.6 var(--mono);text-align:center;color:#fff}
.close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mute);font-size:20px;line-height:1}
.close:hover{background:rgba(255,255,255,.08);color:#fff}
.snap-img{display:block;width:100%;border-radius:8px;border:1px solid var(--line2)}
.snap-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font:500 12.5px var(--mono);color:#fff}
.snap-meta span i{font:400 11px var(--sans);font-style:normal;color:var(--dim);margin-right:4px}
.toast{position:absolute;left:50%;bottom:62px;z-index:35;transform:translate(-50%,20px);padding:9px 16px;border-radius:12px;background:rgba(12,17,30,.95);border:1px solid var(--line2);
  font-size:13px;color:#fff;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* --- narrow windows: keep it from breaking (desktop is the target) ---------------------------------- */
@media (max-width:1100px){
  .brand .en{display:none}
  #viewSeg{display:none}
}
@media (max-width:760px){
  .top{flex-wrap:wrap;padding:10px 10px 0}
  .brand h1{font-size:18px}
  .side{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:42vh}
  .explain,.hint{display:none}
  .rollcard{display:none}
}
@media (prefers-reduced-motion:reduce){.lcd .blink{animation:none}.flash.go{animation:none}}
</style>
</head>
<body>
